<!DOCTYPE html>
<html>
<head>
    <title>Web Kakeibo</title>
</head>
<body>
    <h1>Web Kakeibo</h1>
    <p>ここから家計簿を作っていきます。</p>
    <p>支出総額：{{ total }} 円</p>
    {% if monthly_budget is defined %}
    <p>月間予算：{{ monthly_budget }} 円</p>
    <p>予算残額：{{ remaining }} 円</p>
    {% endif %}
    <form action="/month" method="post">
        <input type="month" name="month">
        <button>月別表示</button>
    </form>

    <form action="/budget" method="post">
        <input type="month" name="month">
        <input type="number" name="money">
        <button>予算を保存</button>
    </form>

    <form action="/add" method="post">
        <input name="item" placeholder="商品名">
        <input name="money" placeholder="金額">
        <input type="date" name="date">
        <button>追加</button>
    </form>

    <form action="/search" method="post">
        <input name="item" placeholder="商品名">
        <button>検索</button>
    </form>

    {% for record in kakeibo %}
    <p>{{record["id"]}}  {{record["item"]}}  {{record["money"]}}円
        <a href="/edit/{{record['id']}}">編集</a>
         <a href="/delete/{{ record['id'] }}">削除</a>
    </p>
    {% endfor %}
</body>
</html>
