<!DOCTYPE html>
<html>
<head>
    <title>Web Kakeibo</title>
</head>
<body>
    <h1>Web Kakeibo</h1>
    <p>ここから家計簿を作っていきます。</p>
    <form action="/add" method="post">
        <input name="item" placeholder="商品名">
        <input name="money" placeholder="金額">
        <button>追加</button>
    </form>

    {% for record in kakeibo %}
    <p>{{record["item"]}}  {{record["money"]}}円</p>
    {% endfor %}
</body>
</html>
